inite" values="0;0;1;1;0;0" keyTimes="0;0.1933;0.206;0.9597;0.9799;1"/><text x="40" y="156" class="m" font-size="18"><tspan fill="#22C55E">  ✓ </tspan><tspan fill="#FAFFFD">Signed in · credentials saved to ~/.ai-game-dev</tspan></text><text x="1160" y="156" text-anchor="end" class="m" font-size="16" font-style="italic" fill="#8AA6B8" fill-opacity=".8">← MachineCredentialStore</text></g><g><animate attributeName="opacity" dur="19.78s" begin="-12.18s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.2312;0.2439;0.9597;0.9799;1"/><text x="40" y="188" class="m" font-size="18" textLength="377.4" lengthAdjust="spacing"><tspan fill="#FF5A73">❯</tspan> <tspan fill="#FAFFFD">unity-mcp-cli setup-mcp claude-code</tspan></text><rect x="38" y="166" width="1200" height="30" fill="#070D14" transform="translate(2400 0)"><animateTransform attributeName="transform" type="translate" dur="19.78s" begin="-12.18s" repeatCount="indefinite" calcMode="discrete" values="0 0;0 0;10.2 0;20.4 0;30.6 0;40.8 0;51.0 0;61.2 0;71.4 0;81.6 0;91.8 0;102.0 0;112.2 0;122.4 0;132.6 0;142.8 0;153.0 0;163.2 0;173.4 0;183.6 0;193.8 0;204.0 0;214.2 0;224.4 0;234.6 0;244.8 0;255.0 0;265.2 0;275.4 0;285.6 0;295.8 0;306.0 0;316.2 0;326.4 0;336.6 0;346.8 0;357.0 0;367.2 0;377.4 0;1587.6 0;1587.6 0" keyTimes="0.0;0.2312;0.241;0.2431;0.2452;0.2473;0.2494;0.2516;0.2537;0.2558;0.2579;0.2601;0.2622;0.2643;0.2664;0.2686;0.2707;0.2728;0.2749;0.277;0.2792;0.2813;0.2834;0.2855;0.2877;0.2898;0.2919;0.294;0.2962;0.2983;0.3004;0.3025;0.3047;0.3068;0.3089;0.311;0.3131;0.3153;0.3174;0.3195;1.0"/></rect></g><g><animate attributeName="opacity" dur="19.78s" begin="-12.18s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.3498;0.3625;0.9597;0.9799;1"/><text x="40" y="220" class="m" font-size="18"><tspan fill="#22C55E">  ✓ </tspan><tspan fill="#FAFFFD">Claude Code → </tspan><tspan fill="#6FA8D0">https://ai-game.dev/mcp/p/6c1e9a…</tspan></text><text x="1160" y="220" text-anchor="end" class="m" font-size="16" f