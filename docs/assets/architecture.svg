><g transform="translate(402 106)"><rect width="192" height="34" rx="17" fill="#0D1A25" stroke="rgba(111,168,208,0.45)" stroke-opacity=".6"/><text x="96.0" y="23" text-anchor="middle" class="s" font-size="16" fill="#A8C2D2">OAuth sign-in</text></g><g transform="translate(606 106)"><rect width="192" height="34" rx="17" fill="#0D1A25" stroke="rgba(111,168,208,0.45)" stroke-opacity=".6"/><text x="96.0" y="23" text-anchor="middle" class="s" font-size="16" fill="#A8C2D2">Credentials &amp; refresh</text></g><g transform="translate(402 154)"><rect width="192" height="34" rx="17" fill="#0D1A25" stroke="rgba(111,168,208,0.45)" stroke-opacity=".6"/><text x="96.0" y="23" text-anchor="middle" class="s" font-size="16" fill="#A8C2D2">Project pin &amp; port</text></g><g transform="translate(606 154)"><rect width="192" height="34" rx="17" fill="#0D1A25" stroke="rgba(111,168,208,0.45)" stroke-opacity=".6"/><text x="96.0" y="23" text-anchor="middle" class="s" font-size="16" fill="#A8C2D2">AI agent configs</text></g><g transform="translate(402 202)"><rect width="192" height="34" rx="17" fill="#0D1A25" stroke="rgba(111,168,208,0.45)" stroke-opacity=".6"/><text x="96.0" y="23" text-anchor="middle" class="s" font-size="16" fill="#A8C2D2">Editor sessions</text></g><g transform="translate(606 202)"><rect width="192" height="34" rx="17" fill="#0D1A25" stroke="rgba(111,168,208,0.45)" stroke-opacity=".6"/><text x="96.0" y="23" text-anchor="middle" class="s" font-size="16" fill="#A8C2D2">Server download</text></g><g transform="translate(402 250)"><rect width="192" height="34" rx="17" fill="#0D1A25" stroke="rgba(111,168,208,0.45)" stroke-opacity=".6"/><text x="96.0" y="23" text-anchor="middle" class="s" font-size="16" fill="#A8C2D2">Exit codes &amp; JSON</text></g><g transform="translate(606 250)"><rect width="192" height="34" rx="17" fill="#0D1A25" stroke="rgba(111,168,208,0.45)" stroke-opacity=".6"/><text x="96.0" y="23" text-anchor="middle" class="s" font-size="16" fill="#A8C2D2">Update check</text></g><rect x="402" y="304" width="396" height="84" rx="14" fill="url(#card)" stroke="rgba(111,168,208,0.16)"/><rect x="402" y="316" width="3" height="60" rx="1.5" fill="#FF5A73"/><text x="424" y="342.0" class="m" font-size="19" font-weight="700" fill="#FAFFFD">EngineAdapter</text><text x="424" y="368.0" class="s" font-size="16" fill="#8AA6B8">the only place where the engines differ</text><text x="600" y="452" text-anchor="middle" class="s" font-size="16" fill="#8AA6B8">Node.js ≥ 22.14 · ESM + type declarations · zero runtime dependencies</text>
