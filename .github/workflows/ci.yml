name: CI

# Chain leg (node `cli-core`, the TypeScript ROOT): every job below also runs under
# `workflow_dispatch` with a chain lock as its input. `.github/scripts/chain_feed.py` (vendored,
# byte-identical to ai-game-dev-software `.scripts/chain/leg/chain_feed.py`) asserts this run is
# at the lock's sha and exports `CHAIN_ACTIVE=1` + `CHAIN_WS_VERSION=<ws>`; `build-test` then packs
# the ws tarball by the script's chain pack recipe and `record` proves that tarball's own
# `package/package.json` version. A root consumes nothing, so there are no lower layers to
# self-build. Every chain step is a no-op ("chain: no lock (ordinary run)") unless a lock is
# supplied: the dispatch input, or the fenced lock block of a `train/`-labelled pull request's body.
# Do not gate these steps on `workflow_dispatch` — that would silently disable the train path.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      lock:
        description: the chain lock JSON (<= 60000 characters)
        required: true
        type: string
      lock_hash8:
        description: first 8 hex characters of the lock hash
        required: true
        type: string

# Empty on ordinary runs => GitHub's default title. The chain dispatcher captures a dispatched run
# by this exact title + headSha.
run-name: ${{ github.event_name == 'workflow_dispatch' && format('chain {0} cli-core', inputs.lock_hash8) || '' }}

# Ordinary runs: cancel superseded runs on the same ref (keeps PR feedback fast) — unchanged.
# Dispatched chain legs: keyed on the LOCK (+ workflow, so this repo's two dispatched workflows
# never share one group) and never cancelled, so two different locks run side by side.
concurrency:
  # SCRATCH PLANT (run 01a09d72...): reverted to the pre-PR unconditional ref-keyed group, to prove
  # the group EXPRESSION is what changed the C02 outcome, not something else. Never merge.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CHAIN_LOCK: ${{ inputs.lock }}
  CHAIN_LOCK_HASH8: ${{ inputs.lock_hash8 }}

jobs:
  build-test:
    name: typecheck + build + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: chain python (posix)
        if: runner.os != 'Windows' && env.CHAIN_PY == ''
        shell: bash
        run: |
          for c in python3 python; do
            if "$c" -c 'import sys; sys.exit(0 if sys.version_info >= (3, 9) else 1)' >/dev/null 2>&1; then
              echo "CHAIN_PY=$c" >> "$GITHUB_ENV"; exit 0
            fi
          done
          echo 'chain: no Python 3.9+ on PATH (tried python3, python)' >&2; exit 2

      # No --edges scope beyond `self`: this job packs, so `record` proves the root's OWN pack.
      - name: chain feed
        id: chain
        run: ${{ env.CHAIN_PY }} .github/scripts/chain_feed.py apply --node cli-core --job build-test --edges self

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # The root's own pack at the lock's ws version, by the chain pack recipe embedded in
      # `chain_feed.py` (`RECIPES`, which is `npm pkg set` — not release.yml's `npm version`); there
      # is no `prepack`, so build before pack.
      # The tarball is NOT uploaded (artifact quota): `record` reads its package/package.json
      # version into the leg record's identity[], which is the evidence.
      - name: chain pack
        if: env.CHAIN_ACTIVE == '1'
        shell: bash
        run: |
          set -euo pipefail
          npm pkg set version="$CHAIN_WS_VERSION"
          npm run build
          npm pack --pack-destination .artifacts/npm

      - name: chain leg record
        id: chain_record
        if: always()
        run: ${{ env.CHAIN_PY }} .github/scripts/chain_feed.py record --node cli-core --job build-test --edges self --job-status ${{ job.status }} --out chain-leg.json

      - name: chain leg artifact
        if: always() && steps.chain_record.outputs.artifact_name != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.chain_record.outputs.artifact_name }}
          path: chain-leg.json
          retention-days: 1

  # Cross-platform store legs (unified-machine-auth 04 §5): the credential store must be green on
  # Windows (real DPAPI + AV/handle timing) and macOS (POSIX permission asserts) as well as Linux.
  build-test-cross:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: chain python (posix)
        if: runner.os != 'Windows' && env.CHAIN_PY == ''
        shell: bash
        run: |
          for c in python3 python; do
            if "$c" -c 'import sys; sys.exit(0 if sys.version_info >= (3, 9) else 1)' >/dev/null 2>&1; then
              echo "CHAIN_PY=$c" >> "$GITHUB_ENV"; exit 0
            fi
          done
          echo 'chain: no Python 3.9+ on PATH (tried python3, python)' >&2; exit 2

      - name: chain python (windows)
        if: runner.os == 'Windows' && env.CHAIN_PY == ''
        shell: pwsh
        run: |
          foreach ($c in 'python', 'py', 'python3') {
            if (-not (Get-Command $c -ErrorAction SilentlyContinue)) { continue }
            $global:LASTEXITCODE = $null
            & $c -c 'import sys; sys.exit(0 if sys.version_info >= (3, 9) else 1)' 2>$null
            if ($LASTEXITCODE -eq 0) { "CHAIN_PY=$c" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8; exit 0 }
          }
          [Console]::Error.WriteLine('chain: no Python 3.9+ on PATH (tried python, py, python3)'); exit 2

      # Neither packs nor drives the twin: sha assertion + record only.
      - name: chain feed
        id: chain
        run: ${{ env.CHAIN_PY }} .github/scripts/chain_feed.py apply --node cli-core --job build-test-cross --edges none

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: chain leg record
        id: chain_record
        if: always()
        run: ${{ env.CHAIN_PY }} .github/scripts/chain_feed.py record --node cli-core --job build-test-cross --edges none --job-status ${{ job.status }} --out chain-leg.json

      - name: chain leg artifact
        if: always() && steps.chain_record.outputs.artifact_name != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.chain_record.outputs.artifact_name }}
          path: chain-leg.json
          retention-days: 1

  # Constrained Language Mode leg (unified-machine-auth 04 §1/§4): with powershell.exe locked down
  # (WDAC/AppLocker CLM blocks Add-Type), the DPAPI codec is unusable and the store must degrade to
  # the structured "store unreadable" state — never crash, never delete, never overwrite.
  # Hosted only: the CLM step mutates MACHINE scope — never move this job (chain leg or not) to a
  # self-hosted runner.
  store-clm:
    name: store suite under ConstrainedLanguage (windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: chain python (windows)
        if: runner.os == 'Windows' && env.CHAIN_PY == ''
        shell: pwsh
        run: |
          foreach ($c in 'python', 'py', 'python3') {
            if (-not (Get-Command $c -ErrorAction SilentlyContinue)) { continue }
            $global:LASTEXITCODE = $null
            & $c -c 'import sys; sys.exit(0 if sys.version_info >= (3, 9) else 1)' 2>$null
            if ($LASTEXITCODE -eq 0) { "CHAIN_PY=$c" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8; exit 0 }
          }
          [Console]::Error.WriteLine('chain: no Python 3.9+ on PATH (tried python, py, python3)'); exit 2

      # Neither packs nor drives the twin: sha assertion + record only. Runs BEFORE CLM engages.
      - name: chain feed
        id: chain
        run: ${{ env.CHAIN_PY }} .github/scripts/chain_feed.py apply --node cli-core --job store-clm --edges none

      - name: Install dependencies
        run: npm ci

      - name: Engage Constrained Language Mode
        shell: pwsh
        run: |
          # SystemPolicy's lockdown debug hook reads __PSLockdownPolicy from the MACHINE scope only —
          # a process-scoped variable does NOT engage (verified 2026-08-14). Machine scope is safe
          # here: hosted runners are ephemeral, single-job VMs.
          [Environment]::SetEnvironmentVariable('__PSLockdownPolicy', '4', 'Machine')
          $mode = (& powershell.exe -NoProfile -NonInteractive -Command '$ExecutionContext.SessionState.LanguageMode' | Out-String).Trim()
          Write-Host "powershell.exe language mode: $mode"
          if ($mode -ne 'ConstrainedLanguage') {
            throw "Constrained Language Mode did not engage (got '$mode') — the CLM leg would be vacuous."
          }

      - name: Store suite under CLM
        # cmd, not pwsh: this step must only LAUNCH node — a constrained pwsh could reject its own
        # script machinery, which would fail the step for a reason unrelated to the store.
        shell: cmd
        env:
          AIGD_EXPECT_CLM: "1"
        run: npx vitest run test/machine-credentials.clm.test.ts test/machine-credentials-v2.test.ts test/machine-credentials.test.ts test/atomic-file.test.ts

      - name: chain leg record
        id: chain_record
        if: always()
        # cmd for the same reason as the CLM step above: CLM may already be engaged machine-wide.
        shell: cmd
        run: ${{ env.CHAIN_PY }} .github/scripts/chain_feed.py record --node cli-core --job store-clm --edges none --job-status ${{ job.status }} --out chain-leg.json

      - name: chain leg artifact
        if: always() && steps.chain_record.outputs.artifact_name != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.chain_record.outputs.artifact_name }}
          path: chain-leg.json
          retention-days: 1
