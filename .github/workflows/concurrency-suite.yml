# The mixed-language REAL-PROCESS refresh concurrency suite (unified-machine-auth 04 §5 / 03 F8,
# task x2): Node workers driving this repo's built dist/ + C# workers driving MCP-Plugin-dotnet's
# McpPlugin.Tests.RefreshHarness, hammering refresh against a local fake AS over ONE shared
# machine credential store. Acceptance: zero family revokes at N≥4 mixed processes over ≥100
# rotations — plus the three mandated falsifiability plants (see the suite file).
#
# THIS WORKFLOW IS THE SUITE'S ONE CI HOME for both repos (the DoD's "one CI home invoking both
# toolchains" option): cli-core owns the driver/fake AS and already has 3-OS coverage, and the
# hosted runners provide the dotnet SDK the C# harness needs. MCP-Plugin-dotnet's own CI builds
# the harness project but does not run the suite. Deliberately a SEPARATE workflow: the required
# check `typecheck + build + test` stays exactly as it is (the suite is opt-in via
# X2_CONCURRENCY=1 and skips itself inside a plain `npm test`).
#
# The C# twin is cloned by ref with a fallback ladder: the coordinated development branch first
# (both halves of x2 land as a coordinated PR pair), then main (after the twin PR merges and its
# branch is deleted, main contains the harness — the ladder is self-healing and needs no edit).
#
# Chain leg (node `cli-core`, job `suite`): under `workflow_dispatch` with a chain lock,
# `.github/scripts/chain_feed.py apply --edges twin:mcp-plugin-dotnet` clones MCP-Plugin-dotnet at
# the LOCK's sha into $CHAIN_TWIN_MCP_PLUGIN_DOTNET (a bogus sha fails `apply` at the fetch — never
# a fallback), the clone step below builds that checkout instead of running the ladder, and
# `record` proves identity[] {consumer: "concurrency-suite twin"} against the lock sha. When the
# lock RELEASES MCP-Plugin-dotnet the variable is unset and the ladder runs (a named skip in the
# record). Every chain step is a no-op unless a lock is supplied (the dispatch input, or the
# fenced lock block of a `train/`-labelled pull request's body).

name: concurrency-suite

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      lock:
        description: the chain lock JSON (<= 60000 characters)
        required: true
        type: string
      lock_hash8:
        description: first 8 hex characters of the lock hash
        required: true
        type: string

# Empty on ordinary runs => GitHub's default title. The chain dispatcher captures a dispatched run
# by this exact title + headSha.
run-name: ${{ github.event_name == 'workflow_dispatch' && format('chain {0} cli-core', inputs.lock_hash8) || '' }}

# Ordinary runs keep the ref-keyed, cancelling group. Dispatched chain legs are keyed on the lock
# (+ workflow, so ci.yml's leg for the same lock is a different group) and never cancelled.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('chain-{0}-{1}', inputs.lock_hash8, github.workflow) || format('x2-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

env:
  MCP_PLUGIN_DOTNET_REPO: https://github.com/IvanMurzak/MCP-Plugin-dotnet.git
  # The non-chain fallback, also used when a lock RELEASES MCP-Plugin-dotnet. Under a lock that
  # pins it, the twin comes from the lock instead. Kept, not edited.
  MCP_PLUGIN_DOTNET_REF: worktree-x2-concurrency-suite
  CHAIN_LOCK: ${{ inputs.lock }}
  CHAIN_LOCK_HASH8: ${{ inputs.lock_hash8 }}

jobs:
  suite:
    name: concurrency suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: chain python (posix)
        if: runner.os != 'Windows' && env.CHAIN_PY == ''
        shell: bash
        run: |
          for c in python3 python; do
            exe="$("$c" -c 'import sys, select, zlib, hashlib; sys.version_info >= (3, 9) or sys.exit(1); print(sys.executable.replace(chr(92), chr(47)))' 2>/dev/null)" || continue
            case "$exe" in /*) ;; *) continue ;; esac
            case "$exe" in *[[:space:]]*) continue ;; esac
            [ -f "$exe" ] && [ -x "$exe" ] || continue
            echo "CHAIN_PY=$exe" >> "$GITHUB_ENV"; exit 0
          done
          echo 'chain: no Python 3.9+ on PATH that runs and reports an absolute, space-free sys.executable (tried python3, python)' >&2; exit 2

      - name: chain python (windows)
        if: runner.os == 'Windows' && env.CHAIN_PY == ''
        shell: pwsh
        run: |
          foreach ($c in 'python', 'python3') {
            $cmd = Get-Command $c -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $cmd) { continue }
            $global:LASTEXITCODE = $null
            try { $out = & $cmd.Source -c 'import sys, select, zlib, hashlib; sys.version_info >= (3, 9) or sys.exit(1); print(sys.executable.replace(chr(92), chr(47)))' 2>$null } catch { continue }
            if ($LASTEXITCODE -ne 0) { continue }
            $exe = (@($out) -join ' ').Trim()
            if ($exe -notmatch '^[A-Za-z]:/\S+\z' -or -not (Test-Path -LiteralPath $exe -PathType Leaf)) { continue }
            "CHAIN_PY=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8; exit 0
          }
          [Console]::Error.WriteLine('chain: no Python 3.9+ on PATH that runs and reports an absolute, space-free sys.executable (tried python, python3; never py)'); exit 2

      # Drives the MCP-Plugin-dotnet twin, packs nothing: the own pack is a named skip.
      - name: chain feed
        id: chain
        run: ${{ env.CHAIN_PY }} .github/scripts/chain_feed.py apply --node cli-core --job suite --edges twin:mcp-plugin-dotnet

      - name: Install and build (dist/ is what the Node workers run)
        run: |
          npm ci
          npm run build

      - name: Clone and build the C# harness (MCP-Plugin-dotnet)
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CHAIN_TWIN_MCP_PLUGIN_DOTNET:-}" ]; then
            # Chain leg: `chain feed` already cloned the twin at the lock's sha. Never the ladder.
            twin="${CHAIN_TWIN_MCP_PLUGIN_DOTNET//\\//}"
            echo "twin: chain lock checkout $twin"
          else
            # Forward slashes everywhere: RUNNER_TEMP is backslashed on the Windows runner and the
            # resulting path crosses bash, dotnet, and a Node spawn.
            twin="${RUNNER_TEMP//\\//}/mcp-plugin-dotnet"
            git clone --depth 1 --branch "$MCP_PLUGIN_DOTNET_REF" "$MCP_PLUGIN_DOTNET_REPO" "$twin" \
              || git clone --depth 1 --branch main "$MCP_PLUGIN_DOTNET_REPO" "$twin"
          fi
          echo "twin ref: $(git -C "$twin" rev-parse HEAD) ($(git -C "$twin" branch --show-current))"
          dotnet build "$twin/McpPlugin.Tests.RefreshHarness/McpPlugin.Tests.RefreshHarness.csproj" -c Release -f net9.0
          echo "X2_CSHARP_HARNESS=$twin/McpPlugin.Tests.RefreshHarness/bin/Release/net9.0/McpPlugin.Tests.RefreshHarness.dll" >> "$GITHUB_ENV"

      - name: Run the mixed-language concurrency suite
        env:
          X2_CONCURRENCY: "1"
        run: npx vitest run test/concurrency-suite.subprocess.test.ts

      - name: chain leg record
        id: chain_record
        if: always()
        run: ${{ env.CHAIN_PY }} .github/scripts/chain_feed.py record --node cli-core --job suite --edges twin:mcp-plugin-dotnet --job-status ${{ job.status }} --out chain-leg.json

      - name: chain leg artifact
        if: always() && steps.chain_record.outputs.artifact_name != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.chain_record.outputs.artifact_name }}
          path: chain-leg.json
          retention-days: 1
